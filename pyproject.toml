[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-emergentes"
version = "0.1.0"
description = "Pipeline semanal + dashboard Streamlit do Radar de Eventos Emergentes (autorizações de pequeno risco)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyathena[pandas]>=3.0",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.2",
    "streamlit>=1.50",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
