# Dois processos, um volume: o agendador grava snapshots, o Streamlit só lê.
services:
  agendador:
    build: .
    command: ["radar", "agendar", "--executar-ao-iniciar"]
    env_file: .env
    volumes: ["./data:/app/data", "./extractions/csv:/app/extractions/csv:ro", "~/.aws:/root/.aws:ro"]
    restart: unless-stopped

  dashboard:
    build: .
    command: ["streamlit", "run", "src/radar/presentation/streamlit/app.py",
              "--server.port=8501", "--server.address=0.0.0.0"]
    env_file: .env
    volumes: ["./data:/app/data"]
    ports: ["8501:8501"]
    restart: unless-stopped
